<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de registro</title>
    <link rel="stylesheet" href="practica4.css">
    <script src="practica4.js"></script>
</head>
<body>
    <h1>Formulario</h1>
    <hr>
    <label for="">Nombre:</label>
    <input type="text" placeholder="Teclea el nombre del alumno">
    <br><br>
    <label for="">Edad:</label>
    <input type="number" placeholder="Teclea la edad">
    <br><br>
    <label for="">Fecha de nacimiento:</label>
    <input type="date">
    <br><br>
    <label for="">Genero:</label>
    <select>
        <option selected>Selecciona un genero</option>
        <option value="Femenino">Femenino</option>
        <option value="Masculino">Masculino</option>
        <option value="Otro">Otro</option>
    </select>
    <select name="" id="">
        <option selected>Selecciona una escuela</option>
        <option value="">CETis 107</option>
        <option value="">CerroBTis 002</option>
        <option value="">CerroBAO</option>
    </select><br><br>
    <label for="">Correo Electronico</label>
    <input type="email" name="" id=""><br><br>
    <input type="button" value="Registrar" id="boton"> 
    <input type="button" value="Cancelar">
    
</body>
</html>
